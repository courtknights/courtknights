# Local development stack for CourtKnights.
#
# Starts:
#   - postgres   — PostgreSQL 16 on port 5432
#   - oauth-mock — local OAuth2 fake for Google and GitHub (tools/oauthfake) on port 8090
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down -v   # stop and wipe volumes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courtknights
      POSTGRES_PASSWORD: courtknights
      POSTGRES_DB: courtknights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtknights"]
      interval: 5s
      timeout: 5s
      retries: 5

  oauth-mock:
    # Local OAuth2 fake for Google and GitHub (tools/oauthfake, ADR-014).
    # Supports the redirect flow and the device flow (RFC 8628) for both providers.
    build: ./tools/oauthfake
    command: ["--addr", ":8080", "--base-url", "http://localhost:8090"]
    ports:
      - "8090:8080"

volumes:
  postgres_data:
